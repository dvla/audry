trigger:
  batch: true
  branches:
    include:
      - main
      - feature/*
      - fix/*
      - infra/*
      - renovate/*
    exclude:
      - releases/*

variables:
  # Service Connection
  - name: azureSubscriptionSvcConn
    value: 'ETL-MI-Audry-SvcConnection'
  #Bicep files
  - name: templateFile
    value: '$(Build.SourcesDirectory)/infra/azure.bicep'
  - name: csmParametersFile
    value: '$(Build.SourcesDirectory)/infra/azure.bicepparam'
# Used by Bicep
  # These values are used for all branches other than main (i.e. dev work)
  - name: BOT_ID
    value: '30ddfda1-9bf3-4dd9-9837-3d06e7617559' # This will be from bicep outputs
  - name: LOCATION
    value: 'uksouth'
  - name: TENANT_ID
    value: '99d20d2d-8923-45d8-b9ad-5038c97582e3'
  - name: RESOURCE_BASE_NAME
    value: 'audry'
  - name: ENV_NAME
    value: 'dev'
  - name: WEB_APP_SKU
    value: 'B1'
  - name: BOT_DISPLAY_NAME
    value: 'Bot-$(RESOURCE_BASE_NAME)-$(ENV_NAME)'
  - name: TEAMSAPP_CLI_VERSION
    value: "3.0.4"
  
  # These values will override the above if the branch is main (i.e. for production)
  - ${{ if contains(variables['Build.SourceBranchName'], 'main') }}:
      - name: BOT_ID
        value: '9ab7bfc7-fc6c-4637-b87c-17afc2ee7b4b' # This will be from bicep outputs
      - name: ENV_NAME
        value: 'prod'

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: BuildApp
    #condition: not(contains(variables['Build.SourceBranchName'], 'infra')) #Do not run this stage for Infrastructure branches
    displayName: Build and Test
    jobs:
    - job: BuildAndTest
      displayName: Build and Test
      steps:
      # Install Node.js
      - task: UseNode@1
        displayName: 'Install Node.js'
        inputs:
          version: "22"
          checkLatest: true
      # Install dependencies
      - script: |
          npm ci
        displayName: 'Install dependencies'
      - script: |
          npm run build
        displayName: 'Build the project'
      - script: |
          npm run prettier
        displayName: 'Run prettier'
      - script: |
          npm run lint
        displayName: 'Run Linter'
      - script: |
          npm run audit
        displayName: 'Run Audit'
        continueOnError: true
      - script: |
          npm run outdated
        displayName: 'Run Outdated'
        continueOnError: true
      - script: |
          npm run test
        displayName: 'Run Tests'
      - task: PublishTestResults@2
        displayName: 'Publish Test Results'
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: '$(Build.SourcesDirectory)/test/junit-report.xml'  
      - task: PublishCodeCoverageResults@2
        displayName: 'Publish Code Coverage'
        inputs:
          summaryFileLocation: '$(Build.SourcesDirectory)/coverage/cobertura-coverage.xml'
      - script: |
          npm prune --omit=dev
        displayName: 'Remove dev dependencies'
        condition: always()
      - task: CopyFiles@2
        displayName: 'Copy Files to: ArtifactStagingDirectory'
        inputs:
          Contents: |
            $(Build.SourcesDirectory)/lib/**
            $(Build.SourcesDirectory)/node_modules/**
            $(Build.SourcesDirectory)/package.json
          TargetFolder: '$(Build.ArtifactStagingDirectory)'
      - task: ArchiveFiles@2
        displayName: 'Archive files'
        inputs:
          rootFolderOrFile: '$(Build.ArtifactStagingDirectory)'
          includeRootFolder: false
          archiveType: 'zip'
          archiveFile: '$(Pipeline.Workspace)/audry.zip'
          replaceExistingArchive: true
      - publish: '$(Pipeline.Workspace)/audry.zip'
        artifact: AudryZipDeployFile

# Deploy the infrastructure via Bicep
  - stage: Infrastructure
    condition: and(succeeded(), not(and(contains(variables['Build.SourceBranchName'], 'renovate'), not(contains(variables['Build.SourceBranchName'], 'bicep'))))) # Do not run this stage for Renovate branches unless they contain 'bicep' in the name
    displayName: Create infrastructure
    jobs:
    - job: CreateInfrastructure
      displayName: Create infrastructure
      steps:
      - task: AzureKeyVault@2
        displayName: 'Download secrets from Azure Key Vault'
        inputs:
          azureSubscription: '$(azureSubscriptionSvcConn)'
          KeyVaultName: 'kv-lab-shared-prod'
          SecretsFilter: 'audry-gemini-apikey'
          RunAsPreJob: false
      - task: AzureResourceManagerTemplateDeployment@3
        name: BicepDeploy
        env:
          GEMINI_KEY: $(audry-gemini-apikey)
        inputs:
          deploymentScope: 'Subscription'
          location: '$(LOCATION)'
          csmFile: '$(templateFile)'
          csmParametersFile: '$(csmParametersFile)'
          deploymentMode: 'Incremental'
          deploymentName: 'DeployPipelineTemplate'
          connectedServiceName: '$(azureSubscriptionSvcConn)'
          deploymentOutputs: bicepOutputs
      - task: PowerShell@2
        displayName: Get Bicep outputs
        inputs:
          targetType: 'inline'
          script: |
            echo '##vso[task.setvariable variable=bicepouts;]$(bicepOutputs)'
            echo $bicepouts
            mkdir -p $(Pipeline.Workspace)/bicep
            echo '$(bicepOutputs)' > $(Pipeline.Workspace)/bicep/bicepOutputs.json
      - publish: $(Pipeline.Workspace)/bicep/bicepOutputs.json
        artifact: bicepOutputsJsonFile


  - stage: ZipDeploy
    condition: and(succeeded(), not(contains(variables['Build.SourceBranchName'], 'renovate'))) # Do not run this stage for Renovate branches
    displayName: Zip deploy
    jobs:
      - job: ZipDeploy
        displayName: Zip deploy
        steps:
        - checkout: self
        - task: DownloadPipelineArtifact@2
          displayName: 'Download Audry Zip Deploy File'
          inputs:
            buildType: 'current'
            artifactName: 'AudryZipDeployFile'
            targetPath: '$(Pipeline.Workspace)'
        - task: AzureCLI@2
          displayName: 'Create Azure Web App'
          inputs:
            azureSubscription: '$(azureSubscriptionSvcConn)'
            scriptType: 'pscore'
            scriptLocation: 'inlineScript'
            inlineScript: |
              echo 'Deploying web app...'
              az webapp deploy --resource-group "rg-$(RESOURCE_BASE_NAME)-$(ENV_NAME)-uks" --name "app-$(RESOURCE_BASE_NAME)-$(ENV_NAME)-uks" --src-path '$(Pipeline.Workspace)/audry.zip' --track-status false
          # Get BotID from Bicep outputs
        - task: DownloadPipelineArtifact@2
          displayName: 'Download Bicep Outputs'
          inputs:
            buildType: 'current'
            artifactName: 'bicepOutputsJsonFile'
            targetPath: '$(Pipeline.Workspace)'
        - script: |
            BICEP_OUTPUTS1=$(cat $(Pipeline.Workspace)/bicepOutputs.json)
            BICEP_BOT_ID=$(echo "$BICEP_OUTPUTS1" | jq -r '.bot_id.value')
            echo "##vso[task.setvariable variable=BOT_ID;]$BICEP_BOT_ID"
            echo "BOT_ID is set to: $BICEP_BOT_ID"
          displayName: 'Set BOT_ID from Bicep outputs'
          # Install Node.js
        - task: UseNode@1
          displayName: 'Install Node.js'
          inputs:
            version: "22"
            checkLatest: true
          #Install 365 Agents Toolkit
        - script: |
            npm install -g @microsoft/m365agentstoolkit-cli
          displayName: "Install 365 Agents Toolkit"
          # Add BOT_ID to .env file
        - pwsh: |
            Write-Host "Updating .env file with BOT_ID: $($env:BOT_ID)"
            $content = Get-Content -Path $(Build.SourcesDirectory)/env/.env.$($env:ENV_NAME) | ForEach-Object {
              if ($_ -match 'BOT_ID=') {
                  $_ -replace "BOT_ID=.*", "BOT_ID=$($env:BOT_ID)"
              } else {
                  $_
              }
            } 
            $content| Set-Content -Path $(Build.SourcesDirectory)/env/.env.$($env:ENV_NAME) -Force
          displayName: 'Update .env file with BOT_ID'
          #Create Teams app package
        - script: |
            npx atk package --env $(ENV_NAME)
            ls -lh appPackage/build/appPackage.$(ENV_NAME).zip
          displayName: 'Package application for Teams'
        - publish: '$(Build.SourcesDirectory)/appPackage/build/appPackage.$(ENV_NAME).zip'
          displayName: 'Publish Teams app package'
          artifact: AudryAppPackage